# 폴더 이름이 한글이라 Compose가 프로젝트 이름을 만들지 못하므로 직접 지정합니다.
name: skillpath

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      # Bedrock을 쓸 때만 주석을 풀어 로컬 AWS 프로필을 읽기 전용으로 연결합니다.
      # - ~/.aws:/root/.aws:ro

  # 외부 시연용 임시 주소. `docker compose --profile tunnel up`일 때만 실행되며 누구나 접속할 수 있는 URL이 생깁니다.
  tunnel:
    image: cloudflare/cloudflared:2024.6.1
    command: tunnel --no-autoupdate --url http://app:8501
    depends_on:
      - app
    profiles:
      - tunnel
