name: harness check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Harness check
        run: python harness/check.py
